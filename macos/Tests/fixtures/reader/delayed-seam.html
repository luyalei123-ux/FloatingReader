for(let i=0;i<30;i++)c.fillText('INITIAL COMPLETE READER PARAGRAPH '+i,30,60+i*60);

 c.fillStyle='black';c.font='24px Arial';

 c.fillText('BOUNDARY RECOVERED SENTENCE',30,1940);
 c.fillText('FINAL COMPLETE SENTENCE',30,5000);
},3000);}});
</script>
